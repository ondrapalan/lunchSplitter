<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="plate">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
  </defs>

  <!-- Plate rim -->
  <circle cx="256" cy="256" r="252" fill="#BBBBBB"/>
  <circle cx="256" cy="256" r="244" fill="#E4E4E4"/>
  <circle cx="256" cy="256" r="236" fill="white"/>

  <!-- Diagonal color split -->
  <g clip-path="url(#plate)">
    <polygon points="0,0 512,0 0,512" fill="#1C5DB7"/>
    <polygon points="512,0 512,512 0,512" fill="#C47415"/>
  </g>

  <!-- FORK: head upper-right, handle lower-left -->
  <g transform="translate(256,256) rotate(45)"
     fill="white" stroke="black" stroke-width="9"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="
      M -41.5,-180
      L -24.5,-180 L -24.5,-124 Q -22,-116 -19.5,-124 L -19.5,-180
      L  -2.5,-180 L  -2.5,-124 Q   0,-116   2.5,-124 L   2.5,-180
      L  19.5,-180 L  19.5,-124 Q  22,-116  24.5,-124 L  24.5,-180
      L  41.5,-180
      L  41.5,-116
      C  41.5,-98  30,-90  20,-82
      C  15,-77   14,-70  14,-62
      C  14,-54   15,-52  15,-46
      L  15,168
      C  15,176.3 8.3,183 0,183
      C -8.3,183 -15,176.3 -15,168
      L -15,-46
      C -15,-52 -14,-54 -14,-62
      C -14,-70 -15,-77 -20,-82
      C -30,-90 -41.5,-98 -41.5,-116
      Z"/>
  </g>

  <!-- KNIFE: blade upper-left, handle lower-right -->
  <g transform="translate(256,256) rotate(-45)"
     fill="white" stroke="black" stroke-width="9"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="
      M  15,-46
      L  15,-140
      C  15,-162   8,-176  -4,-182
      C -18,-168 -28,-144 -31,-118
      C -34,-96  -28,-68  -15,-46
      L -15,168
      C -15,176.3 -8.3,183 0,183
      C  8.3,183  15,176.3 15,168
      Z"/>
  </g>
</svg>
