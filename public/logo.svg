<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="plate">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
  </defs>

  <!-- Plate rim -->
  <circle cx="256" cy="256" r="252" fill="#BBBBBB"/>
  <circle cx="256" cy="256" r="244" fill="#E4E4E4"/>
  <circle cx="256" cy="256" r="236" fill="white"/>

  <!-- Diagonal color split -->
  <g clip-path="url(#plate)">
    <polygon points="0,0 512,0 0,512" fill="#1C5DB7"/>
    <polygon points="512,0 512,512 0,512" fill="#C47415"/>
  </g>

  <!-- FORK: tines upper-left, handle lower-right -->
  <g transform="translate(256,256) rotate(45)"
     fill="white" stroke="black" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Fork head: 3 equal-width tines (12px each), 2 gaps (10px each) -->
    <path d="
      M -28,-182 L -28,-110
      L 28,-110
      L 28,-182
      L 16,-182 L 16,-120
      L 6,-120 L 6,-182
      L -6,-182 L -6,-120
      L -16,-120 L -16,-182
      Z
    "/>
    <!-- Neck -->
    <rect x="-8" y="-112" width="16" height="58" rx="8"/>
    <!-- Handle -->
    <rect x="-12" y="-58" width="24" height="240" rx="12"/>
  </g>

  <!-- KNIFE: blade upper-right, handle lower-left -->
  <g transform="translate(256,256) rotate(-45)"
     fill="white" stroke="black" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Blade: longer, straight into handle, no bolster -->
    <path d="
      M  0,-182
      L -6,-62
      L 16,-62
      L 38,-86
      L 42,-130
      L 28,-162
      L  0,-182
      Z
    "/>
    <!-- Handle -->
    <rect x="-12" y="-64" width="24" height="246" rx="12"/>
  </g>
</svg>
