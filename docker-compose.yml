services:
  postgres:
    image: postgres:16-alpine
    container_name: lunchsplitter-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lunchsplitter
    ports:
      - "5433:5432"
    volumes:
      - lunchsplitter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lunchsplitter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lunchsplitter_pgdata:
